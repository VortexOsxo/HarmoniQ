<div class="modal-header">
    <h5 class="modal-title">
        <i class="fa-solid fa-industry me-2" style="color: var(--hq-blue-start);"></i>
        Filtrer les infrastructures
    </h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body p-0">
    <div class="controls-bar p-3 border-bottom bg-light d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" (click)="selectAll()">Tout sélectionner</button>
        <button class="btn btn-sm btn-outline-secondary" (click)="deselectAll()">Tout désélectionner</button>
    </div>

    <div class="p-3">
        <!-- Search -->
        <div class="mb-4">
            <label class="form-label small fw-bold text-uppercase text-muted">Rechercher</label>
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                    <i class="fa-solid fa-magnifying-glass text-muted"></i>
                </span>
                <input type="text" class="form-control border-start-0" placeholder="Nom de l'infrastructure..."
                    [(ngModel)]="mapFilterName">
            </div>
        </div>

        <!-- Types Grid -->
        <div class="mb-4">
            <label class="form-label small fw-bold text-uppercase text-muted">Types d'énergie</label>
            <div class="infra-grid">
                <div class="infra-item" *ngFor="let type of infraTypes">
                    <label class="infra-checkbox-label">
                        <input type="checkbox" [checked]="isInfraTypeSelected(type.key)"
                            (change)="toggleInfraType(type.key)">
                        <span class="infra-color-swatch" [style.background-color]="type.color"></span>
                        <span class="infra-cat-label">{{ type.label }}</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Power Range -->
        <div class="mb-2">
            <label class="form-label small fw-bold text-uppercase text-muted">Puissance installée (MW)</label>
            <div class="row g-3 align-items-center">
                <div class="col-5">
                    <input type="number" class="form-control" placeholder="Min" [(ngModel)]="mapFilterMinPower">
                </div>
                <div class="col-2 text-center text-muted">—</div>
                <div class="col-5">
                    <input type="number" class="form-control" placeholder="Max" [(ngModel)]="mapFilterMaxPower">
                </div>
            </div>
        </div>
    </div>
</div>
