<div class="modal-header">
    <h5 class="modal-title">
        <i class="fa-solid fa-industry me-2" style="color: var(--hq-blue-start);"></i>
        Filtrer les infrastructures
    </h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body p-0">


    <div class="px-3 py-3">
        <div class="row">
            <!-- Column 1: Types d'énergie -->
            <div class="col-5 border-end">
                <div class="mb-2 pb-1 border-bottom">
                    <label class="form-label m-0 item-compact-label">Types d'énergie</label>
                </div>
                <div class="infra-column-list">
                    <div class="infra-item" *ngFor="let type of infraTypes">
                        <label class="infra-checkbox-label">
                            <input type="checkbox" [checked]="isInfraTypeSelected(type.key)"
                                (change)="toggleInfraType(type.key)">
                            <span class="infra-color-swatch" [style.background-color]="type.color"></span>
                            <span class="infra-cat-label">{{ type.label }}</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Column 2: Puissance -->
            <div class="col-3 border-end">
                <div class="mb-2 pb-1 border-bottom">
                    <label class="form-label m-0 item-compact-label">Puissance (MW)</label>
                </div>
                <div class="d-flex flex-column gap-2">
                    <div class="d-flex align-items-center gap-2">
                        <span class="small text-muted" style="width: 30px;">Min</span>
                        <input type="number" class="form-control form-control-sm" placeholder="0" [(ngModel)]="mapFilterMinPower">
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <span class="small text-muted" style="width: 30px;">Max</span>
                        <input type="number" class="form-control form-control-sm" placeholder="Max" [(ngModel)]="mapFilterMaxPower">
                    </div>
                </div>
            </div>

            <!-- Column 3: Origine -->
            <div class="col-4">
                <div class="mb-2 pb-1 border-bottom">
                    <label class="form-label m-0 item-compact-label">Origine</label>
                </div>
                <div class="d-flex flex-column gap-2">
                    <label class="infra-checkbox-label">
                        <input type="checkbox" [(ngModel)]="showRealInfra">
                        <span>Réelles</span>
                    </label>
                    <label class="infra-checkbox-label">
                        <input type="checkbox" [(ngModel)]="showUserInfra">
                        <span>Fictives</span>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
