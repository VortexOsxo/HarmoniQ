<div id="plots">
    <div class="protected-areas-btn-container" [class.detail-open]="isDetailOpen">
        <button class="btn btn-sm infrastructures-btn" [class.btn-infrastructures-active]="mapService.hasSelection()"
            [class.btn-outline-secondary]="!mapService.hasSelection()" (click)="mapService.toggleVisibility()">
            <i class="fa-solid fa-industry"></i>
            <span class="btn-label">Infrastructures</span>
            <span class="settings-trigger" (click)="openInfrastructuresSettings($event)"
                title="Filtrer les infrastructures">
                <i class="fa-solid fa-gear"></i>
            </span>
        </button>
        <button class="btn btn-sm protected-areas-btn" [class.btn-success]="protectedAreasService.hasSelection()"
            [class.btn-outline-secondary]="!protectedAreasService.hasSelection()"
            (click)="protectedAreasService.toggleVisibility()">
            <i class="fa-solid fa-layer-group"></i>
            <span class="btn-label">Aires protégées</span>
            <span class="settings-trigger" (click)="openProtectedAreasSettings($event)" title="Ouvrir les paramètres">
                <i class="fa-solid fa-gear"></i>
            </span>
        </button>
        <button class="btn btn-sm reseau-btn" [class.btn-reseau-active]="reseauService.hasSelection()"
            [class.btn-outline-secondary]="!reseauService.hasSelection()" (click)="reseauService.toggleVisibility()">
            <i class="fa-solid fa-network-wired"></i>
            <span class="btn-label">Réseau</span>
            <span class="settings-trigger" (click)="openReseauSettings($event)" title="Ouvrir les paramètres">
                <i class="fa-solid fa-gear"></i>
            </span>
        </button>

        <div class="wind-year-panel" *ngIf="windMapService.isWindMode()">
            <label for="wind-year-select">Annee</label>
            <select id="wind-year-select" class="form-select form-select-sm" [ngModel]="selectedWindYear"
                (ngModelChange)="onWindYearChange($event)">
                <option *ngFor="let year of windMapService.availableYears()" [ngValue]="year">
                    {{ year }}
                </option>
            </select>
            <small class="wind-error" *ngIf="windMapService.errorMessage()">
                {{ windMapService.errorMessage() }}
            </small>
        </div>
    </div>

    <app-infra-detail-modal />

    <div class="view-content">
        <app-quebec-map class="d-block h-100 w-100" />
    </div>
</div>
