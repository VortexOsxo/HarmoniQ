<div id="plots">
    <!-- Aires protégées button below view buttons -->
    <div class="protected-areas-btn-container" [class.detail-open]="isDetailOpen">
        <button class="btn btn-sm protected-areas-btn" [class.btn-success]="protectedAreasService.isVisible()"
            [class.btn-outline-secondary]="!protectedAreasService.isVisible()"
            (click)="protectedAreasService.toggleVisibility()">
            <i class="fa-solid fa-layer-group"></i>
            Aires protégées
        </button>
        <button class="btn btn-sm reseau-btn" [class.btn-reseau-active]="reseauService.isVisible()"
            [class.btn-outline-secondary]="!reseauService.isVisible()"
            (click)="reseauService.toggleVisibility()">
            <i class="fa-solid fa-network-wired"></i>
            Réseau
        </button>
    </div>

    <!-- Infrastructure detail side panel -->
    <app-infra-detail-modal />

    <!-- Content views (hidden via ngIf for cleaner lifecycle management) -->
    <div class="view-content">
        <app-quebec-map class="d-block h-100 w-100" />
    </div>
</div>
