<div class="modal-header">
    <h5 class="modal-title">
        <i class="fa-solid fa-network-wired me-2" style="color: var(--hq-blue-start);"></i>
        Sélection du réseau électrique
    </h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body p-0">


    <div class="px-3 py-3">
        <div class="row">
            <!-- Column 1: Bus -->
            <div class="col-6 border-end">
                <div class="mb-2 pb-1 border-bottom">
                    <label class="reseau-checkbox-label item-compact-label m-0">
                        <input type="checkbox" [checked]="reseauService.isBusGroupSelected()"
                            (change)="reseauService.toggleBusGroup()">
                        Bus
                    </label>
                </div>
                <div class="reseau-column-list">
                    <div class="reseau-layer-item" *ngFor="let cat of busCategories">
                        <label class="reseau-checkbox-label">
                            <input type="checkbox" [checked]="reseauService.isBusTypeSelected(cat.key)"
                                (change)="reseauService.toggleBusType(cat.key)">
                            <span class="reseau-color-swatch" [style.background-color]="cat.color"></span>
                            <span class="reseau-cat-label">{{ cat.label }}</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Column 2: Lines -->
            <div class="col-6">
                <div class="mb-2 pb-1 border-bottom">
                    <label class="reseau-checkbox-label item-compact-label m-0">
                        <input type="checkbox" [checked]="reseauService.isLineGroupSelected()"
                            (change)="reseauService.toggleLineGroup()">
                        Lignes
                    </label>
                </div>
                <div class="reseau-column-list">
                    <div class="reseau-layer-item" *ngFor="let cat of lineCategories">
                        <label class="reseau-checkbox-label">
                            <input type="checkbox" [checked]="reseauService.isLineTypeSelected(cat.key)"
                                (change)="reseauService.toggleLineType(cat.key)">
                            <span class="reseau-color-swatch" [style.background-color]="cat.color"></span>
                            <span class="reseau-cat-label">{{ cat.label }}</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
