<div class="w-100 position-relative shadow-sm bg-white rounded p-3">
    <div class="d-flex justify-content-end mb-2">
        <div class="btn-group shadow-sm" role="group">
            <button type="button" class="btn" 
                    [class.btn-primary]="simulationCo2GraphService.costMode === 'annuel'"
                    [class.btn-outline-primary]="simulationCo2GraphService.costMode !== 'annuel'"
                    (click)="simulationCo2GraphService.setCostMode('annuel')">
                Émissions Annuelles
            </button>
            <button type="button" class="btn" 
                    [class.btn-primary]="simulationCo2GraphService.costMode === 'construction'"
                    [class.btn-outline-primary]="simulationCo2GraphService.costMode !== 'construction'"
                    (click)="simulationCo2GraphService.setCostMode('construction')">
                Émissions de Construction
            </button>
        </div>
    </div>
    <div [id]="config.CO2_SIMULATION_ID" class="w-100"></div>
</div>
