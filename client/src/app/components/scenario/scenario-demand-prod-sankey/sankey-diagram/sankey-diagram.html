<div class="sankey-container" #sankeyContainer>

  <!-- SVG ribbon overlay — pointer-events disabled on SVG itself, enabled per-path -->
  <svg class="sankey-svg"
       [attr.width]="svgWidth"
       [attr.height]="svgHeight"
       xmlns="http://www.w3.org/2000/svg"
       style="pointer-events:none">
    <path
      *ngFor="let flow of computedFlows; let i = index"
      [attr.d]="flow.path"
      [attr.fill]="flow.color"
      [attr.fill-opacity]="flowOpacity(i)"
      stroke="none"
      style="pointer-events:fill; cursor:default; transition: fill-opacity 0.18s ease"
      (mouseenter)="onFlowMouseEnter(i, $event)"
      (mousemove)="onFlowMouseMove($event, i)"
      (mouseleave)="onFlowMouseLeave()"
    />
  </svg>

  <!-- Tooltip -->
  @if (tooltip) {
    <div class="flow-tooltip"
         [style.left.px]="tooltip.x"
         [style.top.px]="tooltip.y">
      <span class="tooltip-dot" [style.background]="tooltip.color"></span>
      <div class="tooltip-lines">
        <div class="tooltip-line-main">{{ tooltip.lines[0] }}</div>
        <div class="tooltip-line-value">{{ tooltip.lines[1] }}</div>
      </div>
    </div>
  }

  <!-- ── Column 1 : Demande ───────────────────────────────────────────── -->
  <div class="sankey-column demand-column">
    <div class="column-header">1. Demande</div>
    <div class="column-nodes">
      <div
        *ngFor="let node of data.demandNodes; let i = index"
        #demandNodeEl
        class="node-card"
        [style.background-color]="node.color"
        [class.node-card--dimmed]="hoveredNodeKey !== null && hoveredNodeKey !== 'demand-' + i"
        (mouseenter)="onNodeMouseEnter('demand-' + i)"
        (mouseleave)="onNodeMouseLeave()"
      >
        <i class="fa-solid {{ node.icon }} node-icon"></i>
        <div class="node-info">
          <div class="node-label">{{ node.label }}</div>
          <div class="node-value">{{ formatMW(node.value) }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="sankey-gap"></div>

  <!-- ── Column 2 : Production ───────────────────────────────────────── -->
  <div class="sankey-column production-column">
    <div class="column-header">2. Production</div>
    <div class="column-nodes">
      <div
        *ngFor="let node of data.productionNodes; let i = index"
        #prodNodeEl
        class="node-card"
        [style.background-color]="node.color"
        [class.node-card--dimmed]="hoveredNodeKey !== null && hoveredNodeKey !== 'prod-' + i"
        (mouseenter)="onNodeMouseEnter('prod-' + i)"
        (mouseleave)="onNodeMouseLeave()"
      >
        <i class="fa-solid {{ node.icon }} node-icon"></i>
        <div class="node-info">
          <div class="node-label">{{ node.label }}</div>
          <div class="node-value">{{ formatMW(node.value) }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="sankey-gap"></div>

  <!-- ── Column 3 : Impact CO₂ ──────────────────────────────────────── -->
  <div class="sankey-column co2-column">
    <div class="column-header">3. Impact CO<sub>2</sub></div>
    <div class="column-nodes co2-nodes">
      <div #co2NodeEl class="co2-total-card"
           [class.node-card--dimmed]="hoveredNodeKey !== null && hoveredNodeKey !== 'co2'"
           (mouseenter)="onNodeMouseEnter('co2')"
           (mouseleave)="onNodeMouseLeave()">
        <i class="fa-solid fa-cloud co2-cloud-icon"></i>
        <div class="co2-label">CO<sub>2</sub> Total Émis</div>
        <div class="co2-value">{{ totalCo2 | number:'1.0-0' }}</div>
        <div class="co2-unit">tonnes CO<sub>2</sub>/h</div>
      </div>
    </div>
  </div>

</div>
