@if (graphState() === GraphState.Unavailable) {
  <p>Choisis un scénario pour voir des données</p>
} @else if (graphState() === GraphState.Loading) {
  <p>Chargement des données...</p>
} @else if (graphState() === GraphState.Displayable) {
  <div class="sankey-view">
    <div class="sankey-diagram-wrapper">
      <app-sankey-diagram [data]="sankeyData" />
    </div>
    <div class="co2-panel-wrapper">
      <app-co2-details-panel [data]="co2Data" />
    </div>
  </div>
}
