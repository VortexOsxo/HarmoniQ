<div class="modal-dialog" role="document">
    <form id="form-nouveau-scenario" (ngSubmit)="onSubmit()">
        <div class="modal-content">
            <div class="modal-header w-100 d-flex justify-content-between">
                <h5 class="modal-title">Nouveau scénario</h5>
                <button id="tutorial-close-scenario" type="button" class="btn-close" aria-label="Close" (click)="dismiss()"></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <div id="scenario-identity-group">
                        <label for="scenario-nom">Nom du scenario <span class="required-star">*</span></label>
                        <input type="text" class="form-control" id="scenario-nom" name="nom" [(ngModel)]="scenario.nom"
                            placeholder="Nom du scenario" required [maxlength]="nomMaxLength"
                            [class.is-invalid]="scenario.nom.length > nomMaxLength || (nameExistsError !== null)" />
                        <small class="text-muted d-block text-end mt-1">{{ scenario.nom.length }} / {{ nomMaxLength }}</small>
                        @if (nameExistsError) {
                        <div class="field-error text-danger" style="font-size: 0.875rem;">
                            <i class="fas fa-exclamation-circle"></i> {{ nameExistsError }}
                        </div>
                        }

                        <label for="scenario-description">Description</label>
                        <textarea class="form-control" id="scenario-description" name="description"
                            [(ngModel)]="scenario.description" rows="3" [maxlength]="descriptionMaxLength"
                            [class.is-invalid]="scenario.description.length > descriptionMaxLength"></textarea>
                        <small class="text-muted d-block text-end mt-1"
                            [class.text-danger]="scenario.description.length > descriptionMaxLength">{{ scenario.description.length }} / {{ descriptionMaxLength }}</small>

                        <label>Étendue de temps</label>
                        <app-date-picker id="scenario-dates"
                            [(startDate)]="scenario.date_de_debut" [(endDate)]="scenario.date_de_fin" />
                        @if (dateError) {
                        <div class="date-error">
                            <i class="fas fa-exclamation-circle"></i> {{ dateError }}
                        </div>
                        }
                    </div>

                    <div id="scenario-conditions-group">
                        <label for="scenario-weather">Meteo (consomation)</label>
                        <select class="form-control" id="scenario-weather" name="weather"
                            [(ngModel)]="scenario.weather">
                            <option [ngValue]="Weather.Cold">Froid</option>
                            <option [ngValue]="Weather.Typical">Typique</option>
                            <option [ngValue]="Weather.Hot">Chaud</option>
                        </select>

                        <label for="scenario-consomation">Modèle de consommation</label>
                        <select class="form-control" id="scenario-consomation" name="consomation"
                            [(ngModel)]="scenario.consomation">
                            <option [ngValue]="Consumption.Conservative">Conservateur</option>
                            <option [ngValue]="Consumption.Normal">Normal</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="tutorial-submit-scenario" type="submit" class="hq-btn-green" [disabled]="!canSubmit">
                    Créer
                </button>
            </div>
        </div>
    </form>
</div>
