<div class="modal-header py-2">
    <h6 class="modal-title mb-0">
        <i class="fa-solid fa-wind me-2" style="color: var(--hq-blue-start);"></i>
        Carte des vents
    </h6>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body p-3">
    <div class="mb-2">
        <label for="wind-year-select" class="item-compact-label mb-1">Année de simulation</label>
        <select 
            id="wind-year-select" 
            class="form-select form-select-sm" 
            [ngModel]="windMapService.selectedYear()" 
            (ngModelChange)="selectYear($event)"
        >
            <option *ngFor="let year of windMapService.availableYears()" [ngValue]="year">
                {{ year }}
            </option>
        </select>
    </div>

    <div class="mt-2 text-center" *ngIf="windMapService.isLoading()">
        <div class="spinner-border spinner-border-sm text-primary" role="status">
            <span class="visually-hidden">Chargement...</span>
        </div>
        <span class="ms-2 x-small text-muted">Mise à jour de la carte...</span>
    </div>

    <div class="mt-2 alert alert-danger x-small py-1 mb-0" *ngIf="windMapService.errorMessage()">
        {{ windMapService.errorMessage() }}
    </div>
</div>
