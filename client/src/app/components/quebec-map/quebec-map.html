<div id="map" style="height: 100%; width: 100%;"></div>

<!-- Infra Filters toggle button -->
<button class="infra-filter-reopen" *ngIf="!infraFiltersOpen()"
    [class.offset-right]="protectedAreasService.legendOpen() || reseauService.legendOpen()"
    (click)="infraFiltersOpen.set(true)" title="Ouvrir les filtres d'infrastructures">
    <i class="fa-solid fa-filter"></i>
</button>

<!-- Infra Filters panel -->
<div class="infra-filter-legend card" *ngIf="infraFiltersOpen()"
    [class.offset-right]="protectedAreasService.legendOpen() || reseauService.legendOpen()">
    <div class="infra-filter-header">
        <i class="fa-solid fa-filter"></i>
        <strong>Filtres d'infrastructures</strong>
        <button class="infra-filter-close" (click)="infraFiltersOpen.set(false)" title="Fermer">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="infra-filter-body">
        <!-- Name Filter -->
        <div class="filter-section">
            <div class="filter-section-title">Nom</div>
            <div class="filter-input-wrapper">
                <i class="fa-solid fa-magnifying-glass filter-icon"></i>
                <input type="text" class="form-control form-control-sm" placeholder="Ex: Manic-5"
                    [(ngModel)]="mapFilterName" />
            </div>
        </div>

        <!-- Types Filter -->
        <div class="filter-section">
            <div class="filter-section-title d-flex justify-content-between align-items-center">
                <span>Types</span>
                <div>
                    <button class="btn btn-link btn-sm p-0 m-0 text-decoration-none" style="font-size: 0.7rem;" (click)="selectAllInfraTypes()">Tous</button>
                    <span class="mx-1 text-muted">|</span>
                    <button class="btn btn-link btn-sm p-0 m-0 text-decoration-none" style="font-size: 0.7rem;" (click)="deselectAllInfraTypes()">Aucun</button>
                </div>
            </div>
            <div class="infra-layer-item" *ngFor="let infra of infraTypes">
                <label class="infra-checkbox-label">
                    <input type="checkbox" [checked]="isInfraTypeSelected(infra.key)"
                        (change)="toggleInfraType(infra.key)">
                    <span class="infra-cat-label">{{ infra.label }}</span>
                </label>
            </div>
        </div>

        <!-- Power Filter -->
        <div class="filter-section">
            <div class="filter-section-title">Puissance (MW)</div>
            <div class="d-flex align-items-center gap-2">
                <input type="number" class="form-control form-control-sm" placeholder="Min"
                    [(ngModel)]="mapFilterMinPower" />
                <span class="text-muted" style="font-size: 0.8rem;">à</span>
                <input type="number" class="form-control form-control-sm" placeholder="Max"
                    [(ngModel)]="mapFilterMaxPower" />
            </div>
        </div>
    </div>
</div>


<button class="pa-legend-reopen" *ngIf="protectedAreasService.isVisible() && !protectedAreasService.legendOpen()"
    [class.offset-right]="reseauService.legendOpen() || infraFiltersOpen()"
    (click)="protectedAreasService.legendOpen.set(true)">
    <i class="fa-solid fa-layer-group"></i>
</button>

<div class="protected-areas-legend card" *ngIf="protectedAreasService.legendOpen()" [class.offset-right]="reseauService.legendOpen() || infraFiltersOpen()">
    <div class="pa-legend-header">
        <i class="fa-solid fa-layer-group"></i>
        <strong>Aires protégées</strong>
        <button class="pa-legend-close" (click)="protectedAreasService.legendOpen.set(false)">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="pa-legend-controls">
        <button class="btn btn-sm btn-outline-secondary" (click)="protectedAreasService.selectAll()">Tout
            sélectionner</button>
        <button class="btn btn-sm btn-outline-secondary" (click)="protectedAreasService.deselectAll()">Tout
            désélectionner</button>
    </div>

    <div class="pa-legend-body">
        <ng-container *ngFor="let node of protectedAreasService.layerTree">
            <ng-container *ngTemplateOutlet="layerNodeTpl; context: { $implicit: node, depth: 0 }"></ng-container>
        </ng-container>
    </div>
</div>

<ng-template #layerNodeTpl let-node let-depth="depth">
    <div class="pa-layer-item" [class.pa-group-parent]="node.children" [style.padding-left.px]="depth * 20">
        <label class="pa-checkbox-label">
            <input type="checkbox" [checked]="protectedAreasService.isGroupFullySelected(node)"
                (change)="protectedAreasService.toggleNode(node)">
            <span class="pa-layer-name">
                <span *ngIf="node.color" class="pa-color-swatch" [style.background-color]="'rgba(' + node.color[0] + ',' + node.color[1] + ',' + node.color[2] + ',' + (node.color.length > 3 ? node.color[3]/255 : 1) + ')'"></span>
                {{ node.name }}
            </span>
        </label>
    </div>
    <ng-container *ngIf="node.children">
        <ng-container *ngFor="let child of node.children">
            <ng-container
                *ngTemplateOutlet="layerNodeTpl; context: { $implicit: child, depth: depth + 1 }"></ng-container>
        </ng-container>
    </ng-container>
</ng-template>

<!-- Réseau toggle button (below protected areas button) -->
<button class="reseau-legend-reopen" *ngIf="reseauService.isVisible() && !reseauService.legendOpen()"
    [class.offset-right]="protectedAreasService.legendOpen() || infraFiltersOpen()"
    (click)="reseauService.legendOpen.set(true)">
    <i class="fa-solid fa-network-wired"></i>
</button>

<!-- Réseau legend panel -->
<div class="reseau-legend card" *ngIf="reseauService.legendOpen()" [class.offset-right]="protectedAreasService.legendOpen() || infraFiltersOpen()">
    <div class="reseau-legend-header">
        <i class="fa-solid fa-network-wired"></i>
        <strong>Réseau électrique</strong>
        <button class="reseau-legend-close" (click)="reseauService.legendOpen.set(false)">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="reseau-legend-controls">
        <button class="btn btn-sm btn-outline-secondary" (click)="reseauService.selectAll()">Tout sélectionner</button>
        <button class="btn btn-sm btn-outline-secondary" (click)="reseauService.deselectAll()">Tout désélectionner</button>
    </div>

    <div class="reseau-legend-body">
        <div class="reseau-section-title">
            <label class="reseau-checkbox-label">
                <input type="checkbox" [checked]="reseauService.isBusGroupSelected()" (change)="reseauService.toggleBusGroup()">
                <strong>Bus</strong>
            </label>
        </div>
        <div class="reseau-layer-item" *ngFor="let cat of busCategories">
            <label class="reseau-checkbox-label">
                <input type="checkbox" [checked]="reseauService.isBusTypeSelected(cat.key)"
                    (change)="reseauService.toggleBusType(cat.key)">
                <span class="reseau-color-swatch" [style.background-color]="cat.color"></span>
                <span class="reseau-cat-label">{{ cat.label }}</span>
            </label>
        </div>

        <div class="reseau-section-title" style="margin-top: 8px;">
            <label class="reseau-checkbox-label">
                <input type="checkbox" [checked]="reseauService.isLineGroupSelected()" (change)="reseauService.toggleLineGroup()">
                <strong>Lignes</strong>
            </label>
        </div>
        <div class="reseau-layer-item" *ngFor="let cat of lineCategories">
            <label class="reseau-checkbox-label">
                <input type="checkbox" [checked]="reseauService.isLineTypeSelected(cat.key)"
                    (change)="reseauService.toggleLineType(cat.key)">
                <span class="reseau-color-swatch" [style.background-color]="cat.color"></span>
                <span class="reseau-cat-label">{{ cat.label }}</span>
            </label>
        </div>
    </div>
</div>

<div class="map-overlay card p-2 m-2" [class.detail-open]="infraDetailService.isOpen()">
    <p>Ajouter une infrastructure :</p>

    <div class="icon-draggable icon-draggable-tinted icon-draggable-barrage" infraNom="Barrage Hydro-Électrique"
        type="Hydro" route="hydro" draggable="true" ngbTooltip="{{toolTipText}}" placement="top"
        role="img" aria-label="Barrage hydroélectrique"
        [style.background-color]="infraColors['hydro']"></div>

    <div class="icon-draggable icon-draggable-tinted icon-draggable-eolienne" infraNom="Parc Éolien"
        type="EolienneParc" route="eolienneparc" draggable="true" ngbTooltip="{{toolTipText}}" placement="top"
        role="img" aria-label="Parc éolien"
        [style.background-color]="infraColors['eolienneparc']"></div>

    <div class="icon-draggable icon-draggable-tinted icon-draggable-solaire" infraNom="Parc Solaire" type="Solaire"
        route="solaire" draggable="true" ngbTooltip="{{toolTipText}}" placement="top" role="img"
        aria-label="Parc solaire" [style.background-color]="infraColors['solaire']"></div>

    <div class="icon-draggable icon-draggable-tinted icon-draggable-thermique" infraNom="Parc Thermique"
        type="Thermique" route="thermique" draggable="true" ngbTooltip="{{toolTipText}}" placement="top"
        role="img" aria-label="Centrale thermique" [style.background-color]="infraColors['thermique']"></div>

    <div class="icon-draggable icon-draggable-tinted icon-draggable-nucleaire" infraNom="Parc Nucléaire"
        type="Nucleaire" route="nucleaire" draggable="true" ngbTooltip="{{toolTipText}}" placement="top"
        role="img" aria-label="Centrale nucléaire" [style.background-color]="infraColors['nucleaire']"></div>
</div>
