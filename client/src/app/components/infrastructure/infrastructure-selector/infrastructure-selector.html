<div id="infrastructures">
    <!-- Group selector header -->
    <div class="group-selector-header">
        <span class="group-label">Groupe infras actif</span>
        <div class="group-selector-row">
            <select class="group-select" [(ngModel)]="selectedInfrastructureGroup" [compareWith]="compareInfraGroups">
                <option *ngFor="let infraGroup of infrastructureGroups" [ngValue]="infraGroup">
                    {{ infraGroup.nom }}
                </option>
            </select>
            <button class="group-add-btn" title="Créer un nouveau groupe d'infrastructure"
                (click)="openCreateModal()">
                <i class="fa-solid fa-plus"></i>
            </button>
            <app-delete-confirm-button
                *ngIf="selectedInfrastructureGroup && selectedInfrastructureGroup.id !== defaultInfraGroupId as group"
                buttonTitle="Supprimer ce groupe d'infrastructure"
                confirmTitle="Supprimer le groupe d'infrastructures"
                [confirmMessage]="'Êtes-vous sûr de vouloir supprimer ce groupe d\'infrastructures? L\'action est irréversible.'"
                (delete)="deleteInfraGroup()">
            </app-delete-confirm-button>
        </div>
    </div>

    <!-- Infrastructure filter & sort -->
    <div class="infra-toolbar">
        <div class="filter-input-wrapper">
            <i class="fa-solid fa-magnifying-glass filter-icon"></i>
            <input type="text" class="filter-input" placeholder="Chercher une infrastructure..."
                [(ngModel)]="filterText" />
            <button class="filter-clear-btn" *ngIf="filterText" (click)="filterText = ''"
                title="Effacer la recherche">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <button class="sort-toggle-btn" (click)="toggleSort()"
            [title]="sortAsc ? 'Tri : A → Z' : 'Tri : Z → A'">
            <i class="fa-solid" [class.fa-arrow-down-a-z]="sortAsc"
                [class.fa-arrow-down-z-a]="!sortAsc"></i>
        </button>
    </div>

    <!-- Type filter chips -->
    <div class="infra-type-chips">
        <button
            *ngFor="let cat of infras"
            class="infra-chip"
            [class.infra-chip--active]="isFilterActive(cat.type)"
            [style.--chip-color]="infraColors[cat.type]"
            (click)="toggleFilter(cat.type)"
            [title]="cat.name">
            <span
                class="infra-chip-icon infra-category-icon-tinted"
                [ngClass]="{
                    'infra-category-barrage': cat.type === 'hydro',
                    'infra-category-eolienne': cat.type === 'eolienneparc',
                    'infra-category-solaire': cat.type === 'solaire',
                    'infra-category-thermique': cat.type === 'thermique',
                    'infra-category-nucleaire': cat.type === 'nucleaire'
                }"
                [style.background-color]="isFilterActive(cat.type) ? '#fff' : infraColors[cat.type]"
                aria-hidden="true"
            ></span>
            <span class="infra-chip-label">{{ cat.shortName }}</span>
        </button>
    </div>

    <!-- Select all / Deselect all -->
    <div class="controls-bar px-3 py-2 d-flex gap-2" *ngIf="flatFilteredInfras.length > 0">
        <button class="btn btn-xs btn-outline-secondary rounded-pill px-3" (click)="selectAllVisible()">
            <i class="fa-solid fa-check-double me-1"></i> Tout sélectionner
        </button>
        <button class="btn btn-xs btn-outline-secondary rounded-pill px-3" (click)="deselectAllVisible()">
            <i class="fa-solid fa-xmark me-1"></i> Tout désélectionner
        </button>
    </div>

    <!-- Flat infrastructure list -->
    <div class="infra-flat-list" *ngIf="flatFilteredInfras.length > 0">
        <ul class="list-group">
            <app-infra-list-element
                *ngFor="let item of flatFilteredInfras"
                [nom]="item.infra.nom"
                [id]="item.infra.id.toString()"
                [type]="item.type"
                [typeBadgeColor]="infraColors[item.type]"
            />
        </ul>
    </div>

    <!-- Empty state -->
    <div class="infra-empty-state" *ngIf="flatFilteredInfras.length === 0">
        <i class="fa-solid fa-search"></i>
        <p *ngIf="filterText.trim()">Aucune infrastructure trouvée pour "{{ filterText }}"</p>
        <p *ngIf="!filterText.trim()">Aucun type sélectionné</p>
    </div>
</div>
