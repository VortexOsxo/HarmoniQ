<div id="infrastructures">
    <!-- Group selector header -->
    <div class="group-selector-header">
        <span class="group-label">Groupe infras actif</span>
        <div class="group-selector-row">
            <select class="group-select" [(ngModel)]="selectedInfrastructureGroup" [compareWith]="compareInfraGroups">
                <option *ngFor="let infraGroup of infrastructureGroups" [ngValue]="infraGroup">
                    {{ infraGroup.nom }}
                </option>
            </select>
            <button class="group-add-btn" title="Créer un nouveau groupe d'infrastructure"
                (click)="openCreateModal()">
                <i class="fa-solid fa-plus"></i>
            </button>
            <app-delete-confirm-button
                *ngIf="selectedInfrastructureGroup && selectedInfrastructureGroup.id !== defaultInfraGroupId as group"
                buttonTitle="Supprimer ce groupe d'infrastructure"
                confirmTitle="Supprimer le groupe d'infrastructures"
                [confirmMessage]="'Êtes-vous sûr de vouloir supprimer le groupe « ' + selectedInfrastructureGroup!.nom + ' » ? Cette action est irréversible.'"
                (delete)="deleteInfraGroup()">
            </app-delete-confirm-button>
        </div>
    </div>

    <!-- Capacity bar: guaranteed power vs peak demand -->
    <app-capacity-bar />

    <!-- Energy bar: total energy supply vs demand (shown after full simulation) -->
    <app-energy-bar />

    <!-- Infrastructure filter & sort -->
    <div class="infra-toolbar">
        <div class="filter-input-wrapper">
            <i class="fa-solid fa-magnifying-glass filter-icon"></i>
            <input type="text" class="filter-input" placeholder="Chercher une infrastructure..."
                [(ngModel)]="filterText" />
            <button class="filter-clear-btn" *ngIf="filterText" (click)="filterText = ''"
                title="Effacer la recherche">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <button class="sort-toggle-btn" (click)="toggleSort()"
            [title]="sortAsc ? 'Tri : A → Z' : 'Tri : Z → A'">
            <i class="fa-solid" [class.fa-arrow-down-a-z]="sortAsc"
                [class.fa-arrow-down-z-a]="!sortAsc"></i>
        </button>
    </div>

    <!-- Infrastructure accordions -->
    <div ngbAccordion class="infra-accordion" *ngIf="visibleCategories.length > 0">
        <div ngbAccordionItem *ngFor="let infra of visibleCategories" [id]="infra.type">
            <h2 ngbAccordionHeader>
                <button ngbAccordionButton type="button">
                    <span class="infra-accordion-heading">
                        <span
                            class="infra-category-icon infra-category-icon-tinted"
                            [ngClass]="{
                                'infra-category-barrage': infra.type === 'hydro',
                                'infra-category-eolienne': infra.type === 'eolienneparc',
                                'infra-category-solaire': infra.type === 'solaire',
                                'infra-category-thermique': infra.type === 'thermique',
                                'infra-category-nucleaire': infra.type === 'nucleaire'
                            }"
                            [style.background-color]="infraColors[infra.type]"
                            aria-hidden="true"
                        ></span>
                        <span class="infra-accordion-title-text">{{ infra.name }}</span>
                    </span>
                </button>
            </h2>
            <div ngbAccordionCollapse>
                <div ngbAccordionBody>
                    <app-infra-list-body [infras]="getFilteredAndSortedInfras(infra.type)" [type]="infra.type" />
                </div>
            </div>
        </div>
    </div>

    <!-- Empty state for search -->
    <div class="infra-empty-state" *ngIf="filterText.trim() && visibleCategories.length === 0">
        <i class="fa-solid fa-search"></i>
        <p>Aucune infrastructure trouvée pour "{{ filterText }}"</p>
    </div>
</div>
